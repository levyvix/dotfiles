# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    column_width = 0.5
    # Center columns in the viewport (0 = center, 1 = fit/scroll edge).
    focus_fit_method = 0
    # Keep column width when alone; do not stretch a single window to full screen.
    fullscreen_on_one_column = false
    explicit_column_widths = 0.5, 0.7, 1.0
}

# Keep the Omarchy screensaver in real fullscreen even over an existing
# fullscreen window. The default Omarchy rule also floats it, which leaves it
# at a centered 800x600 size in this case.
windowrule = float off, match:class org.omarchy.screensaver

# >>> omarchy-studio:looknfeel — generated; edit outside this block only >>>
# Managed by Omarchy Studio — your look & feel tweaks.
general {
    gaps_in = 7
}
# <<< omarchy-studio:looknfeel <<<

# >>> omarchy-studio:animations — generated; edit outside this block only >>>
# Managed by Omarchy Studio — animation feel: Fast.
animations {
    enabled = yes
    bezier = snappy, 0.05, 0.9, 0.1, 1
    animation = windows, 1, 2, snappy, popin 90%
    animation = fade, 1, 2, snappy
    animation = workspaces, 1, 2, snappy
    animation = layers, 1, 2, snappy
    animation = border, 1, 2, snappy
}
# <<< omarchy-studio:animations <<<
