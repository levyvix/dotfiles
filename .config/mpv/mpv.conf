# MPV Configuration
# Configurações para legendas em português

# Carregar legendas automaticamente do mesmo diretório do vídeo
# all = busca todas as legendas na pasta (melhor para fuzzy matching)
sub-auto=all

# Buscar legendas também em subdiretórios
sub-file-paths=**

# Adicionar diretório de cache de legendas do viu
sub-file-paths-append=~/.cache/viu-subs

# Preferência de idioma para legendas
slang=pt,por,pt-BR,pob,eng

# Preferência de idioma para áudio
alang=jpn,ja,pt,por,pt-BR,eng

# Forçar legendas se disponíveis
sub-visibility=yes

# Permitir múltiplas legendas ao mesmo tempo (útil para comparar)
# sub-files-add=<path> pode ser usado via linha de comando
autocreate-playlist=same
